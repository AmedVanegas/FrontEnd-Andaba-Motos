      <div class="product-card">

  <div class="card-image">
    <img
      [src]="product.productImage"
      [alt]="product.name"
    />
    <span class="card-status" [class.out]="product.status !== 'disponible'">
      <span class="status-dot"></span>
      {{product.status | uppercase}}
    </span>
  </div>

  <div class="card-glass">
    <div class="card-glass-top">
      <h2 class="card-name">{{product.name}}</h2>
      <span class="card-stock">{{product.stock}} en stock</span>
    </div>

    <div class="card-glass-bottom">
      <div class="card-price">
        <span class="price-label">Precio</span>
        <span class="price-value">{{product.price + (product.price * product.roi) | currency:'COP ':'symbol':'1.0'}}</span>
      </div>
      <button class="btn-agregar" aria-label="Agregar al carrito">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>
  </div>

</div>
