<form id="userForm" (ngSubmit)="onSubmit()" [formGroup]="userFormData">

    <h1>Registro Usuario</h1>

    <legend>Datos personales</legend>

    <label for="username">Nombre de usuario</label>
    <input type="text" id="username" formControlName="username" required maxlength="50" placeholder="pepito perez777">

    <label for="document">Documento</label>
    <input type="text" id="document" formControlName="document" required maxlength="16" placeholder="111111111">

    <label for="birthDate">Fecha de nacimiento</label>
    <input type="date" id="birthDate" formControlName="birthDate" required >

    <legend>Contacto y acceso</legend>

    <label for="phoneNumber">Teléfono</label>
    <input type="tel" id="phoneNumber" formControlName="phoneNumber" required maxlength="13" placeholder="311 1111111">

    <label for="email">Correo electrónico</label>
    <input type="email" id="email" formControlName="email" required placeholder="hola@mail.com">

    <label for="password">Contraseña</label>
    <input type="password" id="password" formControlName="password" required minlength="8" placeholder="secreto ajjakdhjkahds">

    <fieldset formGroupName="address">
     <legend>Dirección</legend>

     <label for="street">Calle</label>
     <input type="text" id="street" formControlName="street" required placeholder="30">

     <label for="carrera">Carrera</label>
     <input type="text" id="carrera" formControlName="carrera" required placeholder="40">

     <label for="neighborhood">Barrio</label>
     <input type="text" id="neighborhood" formControlName="neighborhood" placeholder="bosa">

     <label for="city">Ciudad</label>
     <input type="text" id="city" formControlName="city" required placeholder="Miami">

     <label for="department">Departamento</label>
     <input type="text" id="department" formControlName="department" required placeholder="Mitu">

    </fieldset>

    <legend>Configuración de cuenta</legend>

    <label for="rol">Rol</label>
    <select id="rol" formControlName="rol" required>
      <option value="" disabled selected>Selecciona un rol</option>
      <option value="client">Cliente</option>
      <option value="employee">Empleado</option>
      <option value="admin">Administrador</option>
    </select>

    <label for="status">Estado</label>
    <select id="status" formControlName="status">
      <option value="active" selected>Activo</option>
      <option value="inactive">Inactivo</option>
      <option value="banned">Bloqueado</option>
    </select>

    <button type="submit">Crear usuario</button>

  </form>
