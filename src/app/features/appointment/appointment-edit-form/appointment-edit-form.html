<div class="form-page-bg">
    <app-back-button fallback="/dashboard/appointments" />

    <form class="form-page" [formGroup]="formData" (ngSubmit)="onSubmit()">

        <div class="form-header">
            <h1>Editar Cita</h1>
            <p>Actualiza los datos de la cita registrada</p>
        </div>

        <div class="form-section">
            <div class="form-section-title">Datos de la cita</div>
            <div class="form-section-body">

                <div class="form-field-full">
                    <label for="schedule">Fecha y hora</label>
                    <input id="schedule" type="datetime-local" formControlName="schedule" />
                </div>

                <div>
                    <label for="service">Servicio</label>
                    <div class="field-with-action">
                        <select id="service" formControlName="service">
                            <option value="">Selecciona un servicio</option>
                            @for (service of services$ | async; track service._id) {
                            <option [value]="service._id">{{ service.name }} - ${{ service.price }}</option>
                            }
                        </select>
                        <app-quick-create-button route="/dashboard/services/new" [icon]="faGear"
                            label="Registrar servicio nuevo" />
                    </div>
                </div>

                <div>
                    <label for="motorcycle">Motocicleta</label>
                    <div class="field-with-action">
                        <select id="motorcycle" formControlName="motorcycle">
                            <option value="">Selecciona una motocicleta</option>
                            @for (moto of motorcycles$ | async; track moto._id) {
                            <option [value]="moto._id">{{ moto.brand }} - {{ moto.licensePlate }}</option>
                            }
                        </select>
                        <app-quick-create-button route="/dashboard/motorcycles/new" [icon]="faMotorcycle"
                            label="Registrar moto nueva" />
                    </div>
                </div>

            </div>
        </div>

        <div class="form-section">
            <div class="form-section-title">Estado</div>
            <div class="form-section-body">
                <div class="form-field-full">
                    <label for="status">Estado</label>
                    <select id="status" formControlName="status">
                        <option value="pendiente">Pendiente</option>
                        <option value="confirmada">Confirmada</option>
                        <option value="aplazada">Aplazada</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                    @if (!canEditStatus) {
                    <span class="form-hint">Solo el dueño o un administrador puede cambiar el estado.</span>
                    }
                </div>
            </div>
        </div>

        <button type="submit" class="form-submit" [disabled]="formData.invalid">
            Guardar cambios
        </button>

    </form>
</div>
