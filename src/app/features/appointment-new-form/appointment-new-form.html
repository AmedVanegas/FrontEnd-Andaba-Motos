<section class="appointment-page">
  <div class="appointment-card">

    <h1 class="appointment-title">Registrar cita</h1>

      <div class="appointment-success" *ngIf="submitSuccess()">
      <p>¡La cita quedó registrada correctamente!</p>
      <button class="form-submit" type="button" onclick="window.location.reload()">
        Registrar otra
      </button>
    </div>

 <form (ngSubmit)="onSend()" *ngIf="!submitSuccess()">
  
      <div class="form-group">
        <label class="form-label">
          Cliente
          <select class="form-input" formControlName="client">
            <option value="" disabled>Selecciona un cliente</option>
            <option *ngFor="let user of users()" [value]="user._id">
              {{ user.username }} — {{ user.email }}
            </option>
          </select>
        </label>
        <span
          class="form-error"
          *ngIf="formData.get('client')?.invalid && formData.get('client')?.touched"
        >
          El cliente es obligatorio
        </span>
        <span class="form-hint" *ngIf="users.length === 0">
          No hay clientes registrados todavía.
        </span>
      </div>

      <div class="form-group">
        <label class="form-label">
          Servicio
          <select class="form-input" formControlName="service">
            <option value="" disabled>Selecciona un servicio</option>
            <option *ngFor="let service of services()" [value]="service._id">
              {{ service.name }} — COP {{ service.price }}
            </option>
          </select>
        </label>
        <span
          class="form-error"
          *ngIf="formData.get('service')?.invalid && formData.get('service')?.touched"
        >
          El servicio es obligatorio
        </span>
        <span class="form-hint" *ngIf="services.length === 0">
          No hay servicios registrados todavía.
        </span>
      </div>

      <div class="form-group">
        <label class="form-label">
          Motocicleta (opcional)
          <select class="form-input" formControlName="motorcycle">
            <option value="">Sin especificar</option>
            <option *ngFor="let m of motorcycles()" [value]="m._id">
              {{ m.brand }} {{ m.modelName }} — {{ m.licensePlate }}
            </option>
          </select>
        </label>
        <span class="form-hint" *ngIf="motorcycles.length === 0">
          No hay motocicletas registradas todavía.
        </span>
      </div>

      <div class="form-group">
        <label class="form-label">
          Fecha y hora
          <input class="form-input" type="datetime-local" formControlName="schedule" />
        </label>
        <span
          class="form-error"
          *ngIf="formData.get('schedule')?.invalid && formData.get('schedule')?.touched"
        >
          La fecha de la cita es obligatoria
        </span>
      </div>


      <button class="form-submit" type="submit" [disabled]="formData?.pending">
        {{ formData?.pending ? 'Registrando...' : 'Registrar cita' }}
      </button>
    </form>

  </div>
</section>
