<div class="brochure-page">
  <div class="brochure-header">
    <div class="brochure-title">
      <h1>CATÁLOGO <span>/ REPUESTOS</span></h1>
    </div>
    <div class="brochure-filters">
      <button class="filter-btn active">Todos</button>
      <button class="filter-btn">Motor</button>
      <button class="filter-btn">Suspensión</button>
      <button class="filter-btn">Accesorios</button>
      <button class="filter-btn">Ruedas</button>
    </div>
  </div>

  <div class="products-grid">
    @for (product of products$ | async; track $index) {
      
      @if(product.status !== 'no disponible' && product.status !== 'agotado'){
         <product-brochure-card [product]="product" (open)="onOpenDetail($event)"></product-brochure-card>
        
      }@else{
       
      }
    }
  </div>

  @if (selectedProduct) {
    <product-brochure-detail
      [product]="selectedProduct"
      [originRect]="originRect"
      (close)="onCloseDetail()"
    ></product-brochure-detail>
  }
</div>
